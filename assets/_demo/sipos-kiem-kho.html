<!doctype html>
<html lang="vi"><head><meta charset="utf-8" />
<!-- Màn hình minh họa (mock) để làm fixture/test. Không phải ảnh chụp sản phẩm thật. -->
<style>
@font-face{font-family:M;src:url("../../brand/fonts/montserrat-variable.ttf");font-weight:100 900}
body{margin:0;width:750px;height:1334px;font-family:M,sans-serif;background:#F4F6F7;color:#0B4B54}
header{background:#0B4B54;color:#fff;padding:56px 40px 32px;font-size:40px;font-weight:700}
header small{display:block;font-size:24px;font-weight:500;opacity:.8;margin-top:8px}
.scan{margin:32px 40px;padding:28px;border-radius:28px;background:#fff;display:flex;gap:24px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.scan b{display:inline-block;width:96px;height:96px;border-radius:24px;background:#E30000;color:#fff;font-size:48px;text-align:center;line-height:96px}
.scan span{font-size:30px;font-weight:600}
.row{margin:0 40px 20px;padding:26px 28px;background:#fff;border-radius:24px;display:flex;justify-content:space-between;font-size:28px}
.row em{font-style:normal;font-weight:700}.low{color:#E30000}
footer{position:absolute;bottom:48px;left:40px;right:40px;padding:32px;border-radius:28px;background:#E30000;color:#fff;font-size:32px;font-weight:700;text-align:center}
</style></head><body>
<header>Kiểm kho<small>Chi nhánh Quận 1 · hôm nay</small></header>
<div class="scan"><b>⌗</b><span>Quét mã vạch để đếm hàng</span></div>
<div class="row"><span>Cà phê hạt Arabica</span><em>48 gói</em></div>
<div class="row"><span>Sữa tươi 1L</span><em class="low">6 hộp</em></div>
<div class="row"><span>Trà đào túi lọc</span><em>120 túi</em></div>
<div class="row"><span>Ly giấy 16oz</span><em>1.350 cái</em></div>
<div class="row"><span>Đường cát 1kg</span><em class="low">3 gói</em></div>
<footer>Cập nhật tồn kho</footer>
</body></html>

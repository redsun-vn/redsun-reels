<!doctype html>
<html
  lang="vi"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"product","type":"enum","label":"Sản phẩm","default":"sipos","options":[{"value":"sipos","label":"SIPOS"},{"value":"bos","label":"REDSUN BOS"},{"value":"webino","label":"Webino"},{"value":"redsun","label":"REDSUN"}]},
    {"id":"title","type":"string","label":"Tiêu đề","default":"Ứng dụng quản lý bán hàng — ưu đãi đặc biệt, giảm 30%!"},
    {"id":"debugSafeZone","type":"boolean","label":"Hiện safe zone (chỉ preview)","default":false}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Mọi đường dẫn tương đối theo thư mục stage (scripts/lib/stage-project.ts) -->
    <link rel="stylesheet" href="brand/brand.css" />
    <link rel="stylesheet" href="_shared/safe-zone.css" />
    <script src="runtime/gsap/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: var(--canvas-width);
        height: var(--canvas-height);
        overflow: hidden;
        background: var(--color-black);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        color: var(--color-text);
        font-family: var(--font-body);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--color-background);
      }
      #logo {
        position: absolute;
        top: var(--safe-top);
        left: var(--safe-left);
        height: 88px;
      }
      #title {
        position: absolute;
        top: 760px;
        left: var(--safe-left);
        right: var(--safe-right);
        font-family: var(--font-heading);
        font-weight: var(--weight-hero);
        font-size: var(--type-h1);
        line-height: var(--line-tight);
      }
    </style>
  </head>
  <body>
    <!-- Root KHÔNG khai data-duration: thời lượng tính từ clip (REQUIREMENTS §6.4) -->
    <div id="root" data-product="sipos" data-composition-id="main" data-start="0" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <img id="logo" class="clip" data-start="0" data-duration="5" data-track-index="1" src="brand/logos/sipos/sipos-logo-trang.png" alt="" />
      <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="2" data-var-text="title">
        Ứng dụng quản lý bán hàng — ưu đãi đặc biệt, giảm 30%!
      </h1>
      <div id="safe-zone" class="clip safe-zone-overlay" data-start="0" data-duration="5" data-track-index="3" aria-hidden="true">
        <div class="unsafe top"></div>
        <div class="unsafe bottom"></div>
        <div class="unsafe right"></div>
        <div class="unsafe left"></div>
      </div>
      <audio id="music" src="music/test-pad-01.mp3" data-start="0" data-duration="5" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      const LOGO_ON_DARK = {
        sipos: "brand/logos/sipos/sipos-logo-trang.png",
        bos: "brand/logos/bos/bos-logo-nen-toi.png",
        webino: "brand/logos/webino/webino-logo-trang.png",
        redsun: "brand/logos/redsun/redsun-logo-chuan.svg",
      };
      const vars = window.__hyperframes.getVariables();
      const root = document.getElementById("root");
      root.dataset.product = vars.product;
      document.getElementById("logo").src = LOGO_ON_DARK[vars.product];
      if (vars.debugSafeZone) root.classList.add("debug-safe-zone");

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

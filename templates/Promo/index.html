<!doctype html>
<html
  lang="vi"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"props","type":"string","label":"Dữ liệu video (JSON do pnpm build sinh)","default":"{}"},
    {"id":"debugSafeZone","type":"boolean","label":"Hiện safe zone (chỉ preview)","default":false}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Promo — đường dẫn tương đối theo thư mục stage (scripts/lib/stage-project.ts) -->
    <link rel="stylesheet" href="brand/brand.css" />
    <link rel="stylesheet" href="_shared/kit.css" />
    <link rel="stylesheet" href="_shared/kit-styles.css" />
    <link rel="stylesheet" href="_shared/kit-blocks.css" />
    <link rel="stylesheet" href="_shared/safe-zone.css" />
    <script src="runtime/gsap/gsap.min.js"></script>
    <script src="_shared/kit-core.js"></script>
    <script src="_shared/kit-emphasis.js"></script>
    <script src="_shared/kit-motion.js"></script>
    <script src="_shared/kit-blocks.js"></script>
    <script src="_shared/scene-kit.js"></script>
  </head>
  <body>
    <!-- Root KHÔNG khai data-duration: thời lượng tính từ clip (REQUIREMENTS §6.4). Mọi clip do scene-kit.js dựng. -->
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920">
      <div id="safe-zone" class="safe-zone-overlay" aria-hidden="true">
        <div class="unsafe top"></div>
        <div class="unsafe bottom"></div>
        <div class="unsafe right"></div>
        <div class="unsafe left"></div>
      </div>
      <audio id="music" src="music/bgm.mp3" data-start="0" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      RedsunKit.build({ template: "Promo", tl: tl });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

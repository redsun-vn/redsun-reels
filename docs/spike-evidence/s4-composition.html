<!doctype html>
<html lang="vi" data-resolution="portrait" data-composition-variables='[{"id": "scenes", "type": "string", "label": "Scenes JSON", "default": "[{\"text\": \"Cảnh mặc định\", \"img\": \"assets/a.png\", \"dur\": 2}]"}, {"id": "title", "type": "string", "label": "Title", "default": "Tiêu đề"}]'>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000000; }
      #root { width: 100%; height: 100%; position: relative; font-family: Montserrat, sans-serif; color: #ffffff; }
      #title { position: absolute; top: 240px; left: 80px; right: 160px; font-size: 80px; font-weight: 800; }
      .scene { position: absolute; left: 0; top: 500px; width: 1080px; height: 1080px; }
      .scene img { width: 100%; height: 100%; }
      .scene p { position: absolute; bottom: 80px; left: 80px; right: 160px; font-size: 64px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920">
      <h1 id="title" class="clip" data-start="0" data-duration="2" data-track-index="0" data-var-text="title">Tiêu đề</h1>
    </div>
    <script>
      const { scenes } = window.__hyperframes.getVariables();
      const list = JSON.parse(scenes);
      const root = document.getElementById("root");
      const tl = gsap.timeline({ paused: true });
      let t = 0;
      list.forEach((s, i) => {
        const el = document.createElement("div");
        el.className = "scene clip"; el.id = "scene" + i;
        el.dataset.start = String(t); el.dataset.duration = String(s.dur); el.dataset.trackIndex = "1";
        el.innerHTML = '<img src="' + s.img + '" alt="" /><p></p>';
        el.querySelector("p").textContent = s.text;
        root.appendChild(el);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t);
        t += s.dur;
      });
      root.dataset.duration = String(t);
      document.getElementById("title").dataset.duration = String(t);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<!doctype html>
<html lang="vi" data-resolution="portrait">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B4B54; }
      #root { width: 100%; height: 100%; position: relative; font-family: Montserrat, sans-serif; color: #ffffff; }
      #heading { position: absolute; top: 300px; left: 80px; right: 160px; font-weight: 800; font-size: 96px; line-height: 1.15; }
      #extra { position: absolute; top: 820px; left: 80px; right: 160px; font-weight: 400; font-size: 48px; line-height: 1.4; }
      #caption { position: absolute; bottom: 500px; left: 80px; right: 160px; font-weight: 700; font-size: 64px; line-height: 1.3; text-align: center; }
      #caption .w { display: inline-block; opacity: 0; }
      #lower { position: absolute; bottom: 400px; left: 80px; font-style: italic; font-weight: 500; font-size: 44px; background: #E30000; padding: 12px 28px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <h1 id="heading" class="clip" data-start="0" data-duration="6" data-track-index="0">Ứng dụng quản lý bán hàng — ưu đãi đặc biệt, giảm 30%!</h1>
      <p id="extra" class="clip" data-start="0" data-duration="6" data-track-index="1">ă â đ ê ô ơ ư · Ă Â Đ Ê Ô Ơ Ư · à á ả ã ạ · ằ ắ ẳ ẵ ặ · ừ ứ ử ữ ự · ỳ ý ỷ ỹ ỵ<br/>SIPOS · REDSUN BOS · Webino</p>
      <div id="caption" class="clip" data-start="0" data-duration="6" data-track-index="2"><span class="w" id="w0">Ứng</span> <span class="w" id="w1">dụng</span> <span class="w" id="w2">quản</span> <span class="w" id="w3">lý</span> <span class="w" id="w4">bán</span> <span class="w" id="w5">hàng</span> <span class="w" id="w6">—</span> <span class="w" id="w7">ưu</span> <span class="w" id="w8">đãi</span> <span class="w" id="w9">đặc</span> <span class="w" id="w10">biệt,</span> <span class="w" id="w11">giảm</span> <span class="w" id="w12">30%!</span> </div>
      <div id="lower" class="clip" data-start="0" data-duration="6" data-track-index="3">Chị Hằng — Quán Phở Ngõ Huế</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#heading", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6 }, 0);
      tl.fromTo("#lower", { x: -600 }, { x: 0, duration: 0.5 }, 0.4);
      gsap.utils.toArray("#caption .w").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25 }, 0.8 + i * 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
